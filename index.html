<meta charset="utf-8">
<title>후동부 사무실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
/* Layout: 잔디 블록 상단바 → 왼쪽 인벤토리(내 자리·출퇴근·컨텐츠·현황) + 오른쪽 사무실 월드와 핫바. 팀원 데이터는 공유 저장소에서 실시간으로 */
:root {
  color-scheme: dark;
  --sky: #1d2433;
  --ink: #f3f0e6;
  --ink-dim: #b8b2a4;
  --ink-mute: #8f897c;
  --stone: #3a3a3a;
  --stone-hi: #5a5a5a;
  --stone-lo: #1e1e1e;
  --well: #262626;
  --row: #313131;
  --slot: #8b8b8b;
  --grass: #5c9a35;
  --grass-lo: #3d6b22;
  --dirt: #6b4a2f;
  --dirt-lo: #4a321f;
  --plank: #a87f4f;
  --plank-lo: #8a643a;
  --dark-oak: #4a3420;
  --dark-oak-lo: #2e2014;
  --hoodie: #7fb0aa;
  --gold: #f4c542;
  --xp: #80d040;
  --xp-lo: #3c7a18;
  --red: #e0533f;
  --sea: #2f6f86;
  --f-pixel: 'Press Start 2P', 'Do Hyeon', monospace;
  --f-kr: 'Do Hyeon', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--sky); color: var(--ink); }
body { font-family: var(--f-kr); font-size: 17px; line-height: 1.35; -webkit-font-smoothing: none; }
button, input, select { font: inherit; color: inherit; }
canvas { image-rendering: pixelated; display: block; }
.app {
  min-height: 100%;
  display: flex; flex-direction: column; gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- 마크 UI ---------- */
.panel {
  background: var(--stone);
  border: 3px solid #000;
  box-shadow: inset 3px 3px 0 var(--stone-hi), inset -3px -3px 0 var(--stone-lo);
  padding: 14px;
  min-width: 0;
}
.mc-btn {
  background: #6f6f6f;
  border: 3px solid #000;
  box-shadow: inset 3px 3px 0 #a9a9a9, inset -3px -3px 0 #3f3f3f;
  padding: 8px 12px;
  cursor: pointer;
  text-shadow: 2px 2px 0 #2a2a2a;
  font-size: 16px; line-height: 1.2;
  white-space: nowrap;
}
.mc-btn:hover { background: #8a8aa8; }
.mc-btn:active { box-shadow: inset -3px -3px 0 #a9a9a9, inset 3px 3px 0 #3f3f3f; }
.mc-btn:disabled { opacity: .45; cursor: not-allowed; }
.mc-btn.green { background: #3f8a22; box-shadow: inset 3px 3px 0 #74c94a, inset -3px -3px 0 #22500f; }
.mc-btn.green:hover { background: #4ea42b; }
.mc-btn.red { background: #9c3324; box-shadow: inset 3px 3px 0 #e07a68, inset -3px -3px 0 #5a1a10; }
.mc-btn.red:hover { background: #b83d2b; }
.mc-btn[aria-pressed="false"] { opacity: .6; }
.mc-btn.small { padding: 5px 8px; font-size: 14px; }
:is(.mc-btn, .slot, .desk, .mob, input, select):focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.label { font-family: var(--f-pixel); font-size: 10px; letter-spacing: .06em; color: var(--gold); text-shadow: 2px 2px 0 #000; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.section-head .aside { font-size: 14px; color: var(--ink-mute); }
.muted { color: var(--ink-mute); font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: var(--ink-dim); }
.txt {
  width: 100%; min-width: 0;
  background: #000; border: 2px solid #a0a0a0;
  padding: 7px 10px; font-size: 16px; color: var(--ink);
}
.txt::placeholder { color: #7d7d7d; }
select.txt { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, #bbb 50%), linear-gradient(-45deg, transparent 50%, #bbb 50%); background-position: calc(100% - 16px) 55%, calc(100% - 10px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 28px; }
.notice {
  border: 2px solid #000; padding: 8px 10px; font-size: 15px;
  background: #4a3a14; color: #ffe9a8;
}
.notice.info { background: #173444; color: #cdeefc; }

/* ---------- 상단바 ---------- */
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 14px;
  border: 3px solid #000;
  background:
    linear-gradient(var(--grass) 0 18px, var(--grass-lo) 18px 24px, transparent 24px),
    repeating-linear-gradient(90deg, var(--dirt) 0 12px, var(--dirt-lo) 12px 16px, var(--dirt) 16px 28px);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-block {
  width: 44px; height: 44px; flex: none; border: 3px solid #000;
  background: linear-gradient(var(--grass) 0 12px, var(--grass-lo) 12px 15px, transparent 15px), repeating-linear-gradient(45deg, var(--dirt) 0 6px, var(--dirt-lo) 6px 9px);
}
.brand h1 { margin: 0; font-size: 28px; font-weight: 400; line-height: 1; color: #fff; text-shadow: 3px 3px 0 #000; }
.brand p { margin: 4px 0 0; font-family: var(--f-pixel); font-size: 9px; color: #e9f5d8; text-shadow: 2px 2px 0 #000; }
.top-right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.headcount {
  font-size: 16px; background: rgba(0,0,0,.55); border: 2px solid #000; padding: 6px 10px;
  text-shadow: 2px 2px 0 #000; white-space: nowrap;
}
.headcount b { color: var(--xp); font-weight: 400; }

/* ---------- 그리드 ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.world-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; order: -1; }
@media (min-width: 1040px) {
  html, body { height: 100%; }
  .app { height: 100%; }
  .main { flex: 1; min-height: 0; grid-template-columns: 380px minmax(0, 1fr); }
  .side { min-height: 0; overflow-y: auto; padding-right: 4px; }
  .world-col { min-height: 0; order: 0; }
  .office { flex: 1; min-height: 520px; }
}

/* ---------- 내 자리 ---------- */
.profile { display: flex; gap: 14px; align-items: center; }
.face-frame {
  flex: none; width: 72px; height: 72px;
  background: var(--slot); border: 3px solid #000;
  box-shadow: inset 3px 3px 0 #373737, inset -3px -3px 0 #fff;
  display: grid; place-items: center;
}
.face-frame canvas { width: 52px; height: 52px; }
.who { min-width: 0; flex: 1; }
.who-name { font-size: 25px; line-height: 1.05; text-shadow: 2px 2px 0 #000; overflow-wrap: anywhere; }
.rank { display: inline-block; margin-left: 6px; vertical-align: 3px; font-size: 14px; color: #2b2100; background: var(--gold); border: 2px solid #000; padding: 1px 7px 0; text-shadow: none; }
.pill { display: inline-block; font-size: 14px; padding: 2px 8px 1px; border: 2px solid #000; white-space: nowrap; }
.pill.in { background: var(--xp); color: #10240a; }
.pill.out { background: #6a6a6a; color: #eee; }
.pill.none { background: #3d3d3d; color: #bbb; }
.who-sub { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-dim); }
.clock-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.clock-row .mc-btn { padding: 12px 8px; font-size: 19px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.stat { background: var(--well); border: 2px solid #000; padding: 8px 10px; }
.stat .k { font-size: 13px; color: var(--ink-mute); }
.stat .v { font-size: 22px; line-height: 1.1; margin-top: 2px; font-variant-numeric: tabular-nums; }
.mini-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

.join-form { display: flex; flex-direction: column; gap: 10px; }
.skin-pick { display: flex; gap: 12px; align-items: center; }
.skin-preview {
  flex: none; width: 64px; height: 96px;
  background: #1b1b1b; border: 2px solid #000;
  display: grid; place-items: center;
}
.skin-preview canvas { width: 32px; height: 64px; }
.file-btn { position: relative; overflow: hidden; display: inline-block; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ---------- 업무 ---------- */
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.task { display: flex; align-items: center; gap: 10px; background: var(--row); border: 2px solid #000; padding: 6px 8px; font-size: 16px; }
.task input[type="checkbox"] {
  appearance: none; -webkit-appearance: none;
  width: 20px; height: 20px; flex: none; margin: 0;
  background: var(--slot); border: 2px solid #000; box-shadow: inset 2px 2px 0 #373737;
  cursor: pointer; display: grid; place-items: center;
}
.task input[type="checkbox"]:checked { background: var(--xp); box-shadow: inset 2px 2px 0 #b9f08a, inset -2px -2px 0 var(--xp-lo); }
.task input[type="checkbox"]:checked::after { content: ""; width: 8px; height: 8px; background: #10240a; }
.task .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.task.done .t { color: var(--ink-mute); text-decoration: line-through; }
.tag { flex: none; font-size: 12px; padding: 1px 6px 0; border: 2px solid #000; background: var(--sea); color: #e8f7fd; white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
.tag.none { background: #4a4a4a; color: #ccc; }
.del { flex: none; border: 0; background: none; cursor: pointer; color: var(--ink-mute); font-family: var(--f-pixel); font-size: 10px; padding: 4px; }
.del:hover { color: var(--red); }
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 8px; }
.add-row select { grid-column: 1 / -1; }

/* ---------- 컨텐츠 ---------- */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { text-align: left; padding: 9px 12px; white-space: normal; flex: 1 1 140px; }
.tab .t-name { display: block; font-size: 18px; }
.tab .t-pct { display: block; margin-top: 4px; font-family: var(--f-pixel); font-size: 9px; color: #ececec; }
.tab[aria-selected="true"] { background: var(--sea); box-shadow: inset 3px 3px 0 #79c4dc, inset -3px -3px 0 #183f4d; }
.content-card { margin-top: 12px; background: var(--well); border: 3px solid #000; padding: 12px; }
.content-title { font-size: 22px; text-shadow: 2px 2px 0 #000; overflow-wrap: anywhere; }
.xp-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--ink-dim); margin-top: 8px; }
.xp-level { font-family: var(--f-pixel); font-size: 11px; color: var(--xp); text-shadow: 2px 2px 0 #000; }
.xp-bar { margin-top: 6px; height: 14px; border: 2px solid #000; background: #1b1b1b; position: relative; overflow: hidden; }
.xp-fill { height: 100%; width: 0; background: linear-gradient(var(--xp) 0 50%, #62b02c 50% 100%); box-shadow: inset 0 -2px 0 var(--xp-lo); transition: width .35s steps(8); }
.xp-bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), #000 calc(10% - 2px) 10%); opacity: .55; }
.c-group { margin-top: 12px; }
.c-group-name { font-size: 15px; color: var(--hoodie); margin-bottom: 4px; }
.content-admin { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.content-admin .txt { flex: 1 1 160px; }

/* ---------- 출퇴근 현황 ---------- */
.board-wrap { overflow-x: auto; }
.board { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.board th { text-align: left; font-weight: 400; color: var(--ink-mute); font-size: 13px; padding: 4px 6px; border-bottom: 2px solid #000; white-space: nowrap; }
.board td { padding: 6px; border-bottom: 2px solid #2a2a2a; vertical-align: middle; }
.board tr.sel td { background: #2c3a2a; }
.board tr { cursor: pointer; }
.board tr:hover td { background: #333; }
.board .nm { display: flex; align-items: center; gap: 8px; min-width: 110px; }
.board .nm canvas { width: 24px; height: 24px; flex: none; border: 2px solid #000; }
.board .nm span { overflow-wrap: anywhere; }
.board .num { text-align: right; white-space: nowrap; }

.detail { margin-top: 14px; background: var(--well); border: 3px solid #000; padding: 12px; }
.detail-head { display: flex; gap: 10px; align-items: center; }
.detail-head canvas { width: 40px; height: 40px; border: 2px solid #000; flex: none; }
.detail-name { font-size: 20px; overflow-wrap: anywhere; }
.detail-quote { font-size: 14px; color: var(--ink-dim); margin-top: 2px; overflow-wrap: anywhere; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 12px; align-items: end; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.wk .bar-box { height: 90px; width: 100%; display: flex; align-items: flex-end; justify-content: center; background: #1a1a1a; border: 2px solid #000; }
.wk .bar { width: 70%; background: linear-gradient(90deg, var(--xp) 0 50%, #62b02c 50%); border-top: 3px solid #b9f08a; min-height: 0; }
.wk .bar.today { background: linear-gradient(90deg, var(--gold) 0 50%, #d9a92a 50%); border-top-color: #fff2a8; }
.wk .h { font-size: 13px; font-variant-numeric: tabular-nums; }
.wk .d { font-family: var(--f-pixel); font-size: 8px; color: var(--ink-mute); }
.wk .n { font-size: 12px; color: var(--xp); }
.legend { margin-top: 8px; font-size: 13px; color: var(--ink-mute); }

/* ---------- 알림 ---------- */
.log { list-style: none; margin: 0; padding: 10px; background: #0d0d0d; border: 3px solid #000; max-height: 170px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.log li { display: flex; gap: 8px; min-width: 0; }
.log time { flex: none; font-family: var(--f-pixel); font-size: 9px; color: var(--xp); padding-top: 4px; }
.log span { min-width: 0; overflow-wrap: anywhere; color: #d9d4c6; }

/* ---------- 사무실 ---------- */
.office {
  position: relative; min-height: 560px; border: 3px solid #000; overflow: hidden; touch-action: none;
  background: repeating-linear-gradient(0deg, var(--plank) 0 30px, var(--plank-lo) 30px 33px), var(--plank);
}
.office::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(90deg, transparent 0 94px, rgba(0,0,0,.18) 94px 97px, transparent 97px 190px); opacity: .7; }
.wall { position: absolute; left: 0; right: 0; top: 0; height: 17%; min-height: 82px; border-bottom: 6px solid #2b2b2b; background: repeating-linear-gradient(0deg, #6d6d6d 0 18px, #474747 18px 21px), #6d6d6d; }
.wall::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 40px, #474747 40px 43px, transparent 43px 84px); -webkit-mask: repeating-linear-gradient(0deg, #000 0 21px, transparent 21px 42px); mask: repeating-linear-gradient(0deg, #000 0 21px, transparent 21px 42px); }
.window { position: absolute; top: 14px; width: 64px; height: 46px; border: 4px solid var(--dark-oak); background: linear-gradient(#9fd3f5 0 55%, #c6e8fb 55%); }
.window::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--dark-oak); }
.window.w1 { right: 26%; } .window.w2 { right: 6%; }
.clock-board { position: absolute; right: 44%; top: 16px; background: #1b1b1b; border: 4px solid var(--dark-oak); padding: 4px 10px 3px; font-family: var(--f-pixel); font-size: 11px; color: var(--xp); }
.sign { position: absolute; left: 4%; top: 12px; background: var(--plank); border: 4px solid var(--dark-oak); box-shadow: 4px 4px 0 rgba(0,0,0,.35); padding: 6px 16px 5px; text-align: center; color: #2b1a0c; z-index: 2; white-space: nowrap; }
.sign b { display: block; font-weight: 400; font-size: 22px; line-height: 1; }
.sign small { display: block; font-family: var(--f-pixel); font-size: 8px; margin-top: 5px; color: #4a2f17; }
.tip { position: absolute; left: 10px; bottom: 10px; z-index: 3000; background: rgba(0,0,0,.72); border: 2px solid #555; padding: 5px 9px; font-size: 14px; color: #ddd; pointer-events: none; max-width: calc(100% - 20px); }
.tip b { color: var(--gold); font-weight: 400; }

.desk { position: absolute; width: clamp(76px, 17%, 132px); transform: translateX(-50%); cursor: pointer; border: 0; padding: 0; background: none; display: flex; flex-direction: column; align-items: center; }
.desk.boss { width: clamp(124px, 27%, 210px); }
.desk-top { position: relative; width: 100%; height: 22px; background: repeating-linear-gradient(90deg, #b88a55 0 20px, #9a6f40 20px 22px); border: 3px solid #2a1a0c; border-bottom-width: 0; }
.desk-front { position: relative; width: 100%; height: 30px; background: repeating-linear-gradient(0deg, #8a643a 0 9px, #6e4e2c 9px 10px); border: 3px solid #2a1a0c; }
.desk.boss .desk-top { background: repeating-linear-gradient(90deg, #5b4127 0 20px, #45301b 20px 22px); }
.desk.boss .desk-front { height: 36px; background: repeating-linear-gradient(0deg, var(--dark-oak) 0 11px, var(--dark-oak-lo) 11px 12px); }
.plate { position: absolute; left: 50%; bottom: 7px; transform: translateX(-50%); background: var(--gold); color: #2b2100; border: 2px solid #000; font-size: 14px; line-height: 1; padding: 3px 8px 2px; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.monitor { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); width: 40%; height: 26px; background: #222; border: 3px solid #111; }
.monitor::before { content: ""; position: absolute; inset: 3px; background: #123b3a; box-shadow: inset 0 0 0 1px #2c8b86; }
.monitor.off::before { background: #0c0c0c; box-shadow: none; }
.monitor::after { content: ""; position: absolute; left: 50%; top: 100%; width: 8px; height: 4px; margin-left: -4px; background: #111; }
.screen-text { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-pixel); font-size: 7px; color: #8ff0e6; z-index: 1; }
.gold-block { position: absolute; bottom: 100%; right: 8%; width: 18px; height: 18px; background: var(--gold); border: 2px solid #8a6a10; box-shadow: inset 3px 3px 0 #fff2a8, inset -3px -3px 0 #c99a1c; }
.plant { position: absolute; bottom: 100%; left: 8%; width: 16px; height: 22px; }
.plant::before { content: ""; position: absolute; left: 3px; bottom: 0; width: 10px; height: 8px; background: #8a4b2a; border: 2px solid #3a1d0e; }
.plant::after { content: ""; position: absolute; left: 0; bottom: 8px; width: 16px; height: 14px; background: #4f9a30; box-shadow: inset 4px 0 0 #6fc24a, inset -4px -4px 0 #2f6a1a; }
.paper { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%) rotate(-3deg); background: #f3efe2; color: #3a2f20; border: 2px solid #6b5d48; font-size: 13px; line-height: 1.1; padding: 3px 6px 2px; white-space: nowrap; }
.paper.off { background: #c9c3b3; }
.chair { width: 34%; height: 12px; margin-top: 4px; background: #3c3c3c; border: 2px solid #111; }
.desk-label { margin-top: 4px; font-size: 14px; line-height: 1.1; white-space: nowrap; background: rgba(0,0,0,.66); color: #f1dcb4; border: 2px solid rgba(0,0,0,.4); padding: 2px 6px 1px; max-width: 160%; overflow: hidden; text-overflow: ellipsis; }
.desk.taken .desk-label { color: #fff; }
.desk.selected .desk-label { background: var(--gold); color: #2b2100; }

.mob { position: absolute; width: 64px; transform: translate(-50%, -100%); cursor: grab; touch-action: none; }
.mob.dragging { cursor: grabbing; }
.nametag { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.55); color: #fff; padding: 2px 7px 1px; font-size: 15px; white-space: nowrap; line-height: 1.15; pointer-events: none; }
.nametag em { font-style: normal; color: var(--gold); }
.mob.me .nametag { outline: 2px solid var(--xp); }
.bubble { position: absolute; bottom: calc(100% + 34px); left: 50%; transform: translateX(-50%); width: max-content; max-width: 210px; background: #fff; color: #111; border: 3px solid #000; box-shadow: 4px 4px 0 rgba(0,0,0,.4); padding: 7px 10px 6px; font-size: 15px; line-height: 1.3; pointer-events: none; z-index: 2; overflow-wrap: anywhere; }
.bubble::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -8px; border: 8px solid transparent; border-top-color: #000; }
.figure { position: relative; width: 64px; height: 128px; filter: drop-shadow(3px 0 0 rgba(0,0,0,.25)); }
.figure .part { position: absolute; }
.figure .head { left: 16px; top: 0; width: 32px; height: 32px; z-index: 3; }
.figure .body { left: 16px; top: 32px; width: 32px; height: 48px; z-index: 2; }
.figure .arm-r { left: 0; top: 32px; width: 16px; height: 48px; transform-origin: 50% 6px; z-index: 1; }

      if (!dragging || dragging.mob !== mob || e.pointerId !== dragging.id) return;

      if (!dragging.moved && Math.hypot(e.clientX - dragging.sx, e.clientY - dragging.sy) > 6) {
        dragging.moved = true; beep('grab');
        say(mob, pick(mob.member && mob.member.desk === 0 ? LINES.bossGrab : LINES.grab));
      }
      if (!dragging.moved) return;
      let x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top + 60) / r.height * 100;
      x = Math.max(4, Math.min(96, x)); y = Math.max(26, Math.min(99, y));
      if (x < mob.x - 0.3) mob.el.classList.add('facing-left'); else if (x > mob.x + 0.3) mob.el.classList.remove('facing-left');
      mob.x = x; mob.y = y; mob.el.style.left = x + '%'; mob.el.style.top = y + '%';
    });
    const end = e => {
      if (!dragging || dragging.mob !== mob || e.pointerId !== dragging.id) return;
      const moved = dragging.moved; dragging = null;
      mob.el.classList.remove('dragging'); mob.el.classList.add('idle');
      placeMob(mob);
      if (!moved) {
        const now = performance.now();
        if (now - mob.lastTap < 380) { mob.lastTap = 0; mob.bubble.hidden = true; openStatus(mob.id); }
        else { mob.lastTap = now; say(mob, pick(mob.lines || LINES.poke)); }
        return;
      }
      beep('drop');
      const r = office.getBoundingClientRect();
      let best = null, bd = 70;
      DESKS.forEach((d, i) => { const s = seatOf(i); const dd = Math.hypot((s.x - mob.x) / 100 * r.width, (s.y - mob.y) / 100 * r.height); if (dd < bd) { bd = dd; best = s; } });
      if (best) { mob.x = best.x; mob.y = best.y; placeMob(mob); }
      say(mob, pick(LINES.drop));
    };
    mob.el.addEventListener('pointerup', end);
    mob.el.addEventListener('pointercancel', end);
  }

  function npcBoss() { return { name: '후케이', role: '사장', desk: 0, skin: BOSS_SKIN, color: '#7fb0aa', npc: true, quote: '', status: 'in', tasks: [] }; }
  function syncMobs() {
    const want = new Map();
    for (const m of sortedMembers()) if (m.status === 'in') want.set(m.id, m);
    if (!deskOwner(0)) want.set(NPC_ID, npcBoss());
    for (const [id, mob] of mobs) if (!want.has(id)) { cancelWalk(mob); mob.el.remove(); mobs.delete(id); }
    for (const [id, m] of want) {
      let mob = mobs.get(id), fresh = false;
      if (!mob) { mob = makeMob(id); fresh = true; }
      const prevDesk = mob.member && mob.member.desk;
      mob.member = m;
      mob.lines = m.quote ? [m.quote].concat(LINES.poke) : LINES.poke;
      mob.tag.textContent = '';
      mob.tag.append(document.createTextNode(m.name || '팀원'));
      if (m.role) mob.tag.append(' ', el('em', { text: '[' + m.role + ']' }));
      mob.el.classList.toggle('me', id === S.myId);
      mob.el.setAttribute('aria-label', (m.name || '팀원') + (m.role ? ', ' + m.role : '') + '. 두 번 누르면 상태창이 열려요');
      dressMob(mob, m);
      if (fresh) {
        const h = homeOf(mob);
        if (m.npc || !S.loaded) { mob.x = h.x; mob.y = h.y; placeMob(mob); }
        else { mob.x = 4; mob.y = 96; placeMob(mob); walkTo(mob, h.x, h.y); }
      } else if (prevDesk !== m.desk) { const h = homeOf(mob); walkTo(mob, h.x, h.y); }
    }
  }
  setInterval(() => {
    if (document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (const mob of mobs.values()) {
      if (mob.anim || (dragging && dragging.mob === mob) || Math.random() < 0.7) continue;
      if (Math.random() < 0.45) { const h = homeOf(mob); walkTo(mob, h.x, h.y); }
      else walkTo(mob, 8 + Math.random() * 84, 40 + Math.random() * 56);
    }
  }, 4500);

      const s = contentStats(c);
      wrap.append(el('div', { class: 'c-sum-row' },
        el('div', { class: 'top' }, el('span', { text: c.name }), el('span', { text: s.pct + '% · 업무 ' + s.tasks.length + '개 · ' + s.people + '명' })),
        el('div', { class: 'xp-bar' }, el('div', { class: 'xp-fill', style: 'width:' + s.pct + '%' }))));
    }
    box.append(wrap, el('div', { class: 'muted', style: 'margin-top:10px', text: '진행도는 각 업무 진행도의 평균이에요. 컨텐츠 추가와 업무 진행도는 캐릭터 상태창에서 바꿔요.' }));
  }

  /* ================= 상태창 ================= */
  let lastFocus = null;
  function openStatus(id) {
    if (id !== NPC_ID && !S.members.has(id)) return;
    if (S.statusFor !== id) lastFocus = document.activeElement;
    S.statusFor = id;
    beep('open');
    if (id !== NPC_ID) subscribeWeek(id);
    $('modal-back').hidden = false;
    renderStatus();
    renderDesks(); renderHotbar(); renderBoard();
    const close = $('modal').querySelector('.close'); if (close) close.focus();
  }
  function closeStatus() {
    S.statusFor = null;
    $('modal-back').hidden = true;
    if (S.weekUnsub) { S.weekUnsub(); S.weekUnsub = null; } S.weekFor = null; S.week = [];
    renderDesks(); renderHotbar(); renderBoard();
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  $('modal-back').addEventListener('click', e => { if (e.target === e.currentTarget) closeStatus(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal-back').hidden) closeStatus(); });

  function subscribeWeek(id) {
    if (S.weekFor === id) return;
    if (S.weekUnsub) { S.weekUnsub(); S.weekUnsub = null; }
    S.weekFor = id; S.week = [];
    if (!S.store) return;
    try { S.weekUnsub = S.store.onWeek(id, list => { S.week = list || []; if (S.statusFor === id) renderStatus(); }); } catch (e) {}
  }

  function segBar(t, editable) {
    const seg = el('div', { class: 'seg', role: editable ? 'group' : 'img', 'aria-label': t.t + ' 진행도 ' + t.p + '%' });
    for (let k = 1; k <= 4; k++) {
      const on = t.p >= k * 25;
      if (editable) seg.append(el('button', { type: 'button', class: on ? 'on' : '', 'aria-label': (k * 25) + '%로 설정', title: (k * 25) + '%', onclick: () => setProgress(t.id, t.p === k * 25 ? (k - 1) * 25 : k * 25) }));
      else seg.append(el('span', { class: on ? 'on' : '' }));
    }
    return seg;
  }

  function renderStatus() {
    const modal = $('modal');
    const id = S.statusFor; if (!id) return;
    const isNpc = id === NPC_ID;
    const m = isNpc ? npcBoss() : S.members.get(id);
    if (!m) { closeStatus(); return; }
    const mine = !isNpc && id === S.myId && !S.readOnly;
    const now = Date.now();
    const t = isNpc ? { ms: 0, done: 0 } : todayOf(m, now);
    const body = el('canvas'); paintBody(body, m, 4);
    const statusText = isNpc ? '아직 입사 등록 전' : m.status === 'in' ? '근무 중 · ' + stamp(m.since) + ' 출근' : m.status === 'out' ? '퇴근 · ' + stamp(m.since) : '출근 전';
    const kids = [
      el('button', { class: 'mc-btn close', type: 'button', 'aria-label': '상태창 닫기', onclick: closeStatus, text: 'X' }),
      el('div', { class: 'st-head' },
        el('div', { class: 'st-avatar' }, body),
        el('div', { style: 'min-width:0' },
          el('h2', { id: 'st-name', text: m.name + (mine ? ' (나)' : '') }),
          m.role ? el('span', { class: 'st-role', text: m.role }) : null,
          m.quote ? el('div', { class: 'st-quote', text: '“' + m.quote + '”' }) : null,
          el('div', { class: 'st-now' }, longDate(now) + ' ', el('b', { id: 'st-clock', text: hhmmss(now) })),
          el('div', { class: 'st-stats' },
            el('div', { class: 'st-stat' }, el('div', { class: 'k', text: '상태' }), el('div', { class: 'v', style: 'font-size:16px', text: statusText })),
            el('div', { class: 'st-stat' }, el('div', { class: 'k', text: '오늘 근무' }), el('div', { class: 'v', id: 'st-ms', text: fmtDur(t.ms) })),
            el('div', { class: 'st-stat' }, el('div', { class: 'k', text: '오늘 완료 업무' }), el('div', { class: 'v', text: t.done + '개' })))))
    ];
    if (isNpc) {
      kids.push(el('div', { class: 'notice info', text: S.isOwner ? '사장님! “내 자리”에서 입사하기를 누르면 이 자리가 진짜 내 자리가 돼요. 이름과 스킨은 미리 채워져 있어요.' : '사장님이 아직 입사 등록을 하지 않았어요.' }));
    } else {
      // 업무 진행도
      const tasks = m.tasks.slice().sort((a, b) => (a.p === 100) - (b.p === 100) || (b.added || 0) - (a.added || 0));
      const sec = el('div', { class: 'st-sec' },
        el('div', { class: 'st-sec-head' }, el('h3', { text: '업무 진행도' }), el('span', { text: tasks.filter(x => x.p < 100).length + '개 진행 중 · 평균 ' + avgP(tasks.filter(x => x.p < 100)) + '%' })));
      if (!tasks.length) sec.append(el('div', { class: 'st-empty', text: mine ? '아직 업무가 없어요. 아래에서 추가해 보세요.' : '등록된 업무가 없어요.' }));
      for (const tk of tasks) {
        const c = S.contents.find(x => x.id === tk.c);
        sec.append(el('div', { class: 'ptask' + (tk.p === 100 ? ' done' : '') },
          el('div', { class: 'pt-name', text: tk.t }),
          el('div', { class: 'pt-meta' },
            el('span', { class: 'tag' + (c ? '' : ' none'), text: c ? c.name : '기타' }),
            el('span', { class: 'pt-pct', text: tk.p + '%' })),
          segBar(tk, mine),
          el('div', { class: 'seg-zero' },
            el('span', { text: tk.p === 100 && tk.at ? stamp(tk.at) + ' 완료' : tk.added ? stamp(tk.added) + ' 추가' : '' }),
            mine ? el('span', null,
              tk.p > 0 ? el('button', { type: 'button', onclick: () => setProgress(tk.id, 0), text: '0%로' }) : null, ' ',
              el('button', { type: 'button', onclick: () => removeTask(tk.id), text: '지우기' })) : null)));
      }
      if (mine) {
        const inp = el('input', { class: 'txt', type: 'text', maxlength: '60', id: 'st-add', placeholder: '새 업무 (예: 맵 준비)', 'aria-label': '새 업무' });
        const sel = el('select', { class: 'txt', id: 'st-add-c', 'aria-label': '컨텐츠 선택' }, el('option', { value: '', text: '컨텐츠: 기타 업무' }), S.contents.map(c => el('option', { value: c.id, text: '컨텐츠: ' + c.name })));
        const f = el('form', { class: 'add-row' }, sel, inp, el('button', { class: 'mc-btn green', type: 'submit', text: '업무 추가' }));
        f.addEventListener('submit', e => { e.preventDefault(); if (!clip(inp.value, 60)) return; addTask(inp.value, sel.value); inp.value = ''; });
        sec.append(f, el('div', { class: 'st-empty', style: 'margin-top:6px;font-size:13px', text: '칸을 누르면 25%씩 진행도가 바뀌어요. 네 칸을 다 채우면 완료로 기록돼요.' }));
      }
      kids.push(sec);
    }

    // 컨텐츠 진행도 + 추가
    const csec = el('div', { class: 'st-sec' },
      el('div', { class: 'st-sec-head' }, el('h3', { text: '진행 중인 컨텐츠' }), el('span', { text: S.contents.length + '개' })));
    if (!S.contents.length) csec.append(el('div', { class: 'st-empty', text: '아직 컨텐츠가 없어요.' }));
    for (const c of S.contents) {
      const s = contentStats(c);
      const his = isNpc ? [] : s.tasks.filter(x => x.who.id === id);
      const row = el('div', { class: 'cprog' },
        el('div', { class: 'cp-name', text: c.name }),
        el('div', { class: 'cp-num', text: s.pct + '% · 완료 ' + s.done + '/' + s.tasks.length }),
        el('div', { class: 'xp-bar' }, el('div', { class: 'xp-fill', style: 'width:' + s.pct + '%' })),
        isNpc ? null : el('div', { class: 'cp-mine', text: his.length ? m.name + ' 담당 ' + his.length + '개 · 평균 ' + avgP(his) + '%' : m.name + '의 업무 없음' }));
      if (S.isOwner && mine) row.append(el('button', {
        class: 'mc-btn small red del-c', type: 'button', text: '컨텐츠 끝내기',
        onclick: e => {
          const b = e.currentTarget;
          if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = '한 번 더 누르면 목록에서 빠져요'; return; }
          queueWrite(() => S.store.deleteContent(c.id)).then(() => log('컨텐츠 종료: ' + c.name)).catch(() => {});
        }
      }));
      csec.append(row);
    }
    if (mine) {
      const ci = el('input', { class: 'txt', type: 'text', maxlength: '20', id: 'st-new-c', placeholder: '새 컨텐츠 이름', 'aria-label': '새 컨텐츠 이름' });
      const cf = el('form', { class: 'add-row' }, ci, el('button', { class: 'mc-btn green', type: 'submit', text: '컨텐츠 추가' }));
      cf.addEventListener('submit', e => { e.preventDefault(); addContent(ci.value); ci.value = ''; });
      csec.append(cf);
    }
    kids.push(csec);

    // 최근 7일
    if (!isNpc) {
      const byDate = new Map(S.week.filter(d => d && d.date).map(d => [d.date, d]));
      const days = [];
      for (let k = 6; k >= 0; k--) {
        const dt = new Date(now); dt.setDate(dt.getDate() - k);
        const key = dateKey(dt.getTime()), d = byDate.get(key);
        let ms = d ? Number(d.ms) || 0 : 0, done = d && Array.isArray(d.done) ? d.done.length : 0;
        if (k === 0) { ms = Math.max(ms, t.ms); done = Math.max(done, t.done); }
        days.push({ ms, done, today: k === 0, label: WEEKDAY[dt.getDay()], md: (dt.getMonth() + 1) + '/' + dt.getDate() });
      }
      const max = Math.max(4 * 3600000, ...days.map(d => d.ms));
      const total = days.reduce((a, d) => a + d.ms, 0), totalDone = days.reduce((a, d) => a + d.done, 0);
      const week = el('div', { class: 'week', role: 'img', 'aria-label': '최근 7일 근무: ' + days.map(d => d.md + ' ' + fmtShort(d.ms)).join(', ') });
      for (const d of days) week.append(el('div', { class: 'wk' },
        el('span', { class: 'h', text: d.ms ? fmtShort(d.ms) : '-' }),
        el('div', { class: 'bar-box' }, el('div', { class: 'bar' + (d.today ? ' today' : ''), style: 'height:' + Math.round(d.ms / max * 100) + '%' })),
        el('span', { class: 'n', text: d.done ? '완료 ' + d.done : '' }),
        el('span', { class: 'd', text: d.md + ' ' + d.label })));
      kids.push(el('div', { class: 'st-sec' },
        el('div', { class: 'st-sec-head' }, el('h3', { text: '최근 7일 근무' }), el('span', { text: fmtDur(total) + ' · 업무 ' + totalDone + '개 완료' })),
        week, el('div', { class: 'legend', text: '막대는 하루 근무 시간이에요. 노란 막대가 오늘이에요.' })));
      if (S.isOwner && !mine && S.store) kids.push(el('div', { class: 'st-actions' }, el('button', {
        class: 'mc-btn small red', type: 'button', text: '이 팀원 내보내기',
        onclick: e => {
          const b = e.currentTarget;
          if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = '한 번 더 누르면 내보내요'; return; }
          queueWrite(() => S.store.deleteMember(id)).then(() => { log(m.name + ' 팀원을 내보냈어요'); closeStatus(); }).catch(() => {});
        }
      })));
    }
    modal.replaceChildren(...kids.filter(Boolean));
  }

  /* ================= 전체 렌더 ================= */
  function preserve(fn) {
    const vals = {};
    document.querySelectorAll('.side input[id], .side select[id], .modal input[id], .modal select[id]').forEach(i => { if (i.type !== 'file' && i.type !== 'checkbox') vals[i.id] = i.value; });
    const act = document.activeElement && document.activeElement.id;
    fn();
    for (const [id, v] of Object.entries(vals)) { const e = document.getElementById(id); if (e && e.type !== 'file') e.value = v; }
    if (act) { const e = document.getElementById(act); if (e && e !== document.activeElement) e.focus(); }
  }
  function renderHeadcount() {
    const list = sortedMembers(), inN = list.filter(m => m.status === 'in').length;
    const hc = $('headcount'); hc.textContent = '';
    hc.append('근무 중 ', el('b', { text: String(inN) }), '명 · 팀원 ' + list.length + '명');
  }
  function renderAll() {
    preserve(() => {
      syncMobs(); renderDesks(); renderHotbar(); renderMe(); renderBoard(); renderContents(); renderHeadcount();
      if (S.statusFor) renderStatus();
    });
  }

  // 날짜·시계 (화면 표시만, 저장 없음)
  function tick() {
    const now = Date.now();
    $('now-date').textContent = longDate(now);
    $('now-time').textContent = hhmmss(now);
    $('board-date').textContent = (new Date(now).getMonth() + 1) + '.' + new Date(now).getDate() + ' ' + WEEKDAY[new Date(now).getDay()];
    $('board-time').textContent = hhmm(now);
    const m = myMember(); const v = $('my-ms'); if (m && v) v.textContent = fmtDur(todayOf(m, now).ms);
    const sc = $('st-clock'); if (sc) sc.textContent = hhmmss(now);
    const sm = $('st-ms'); const sm2 = S.statusFor && S.members.get(S.statusFor); if (sm && sm2) sm.textContent = fmtDur(todayOf(sm2, now).ms);
  }
  tick(); setInterval(tick, 1000);
  let lastDay = dateKey();
  setInterval(() => { if (document.hidden) return; if (dateKey() !== lastDay) { lastDay = dateKey(); renderAll(); } else renderBoard(); }, 60000);

  /* ================= 버튼 ================= */
  $('btn-sound').addEventListener('click', e => {
    soundOn = !soundOn;
    e.currentTarget.setAttribute('aria-pressed', String(soundOn));
    e.currentTarget.textContent = soundOn ? '사운드 켜짐' : '사운드 꺼짐';
    beep('click');
  });
  $('btn-meeting').addEventListener('click', () => {
    const list = [...mobs.values()];
    list.forEach((mob, i) => {
      const a = (i / Math.max(1, list.length)) * Math.PI * 2;
      walkTo(mob, 50 + Math.cos(a) * 12, 66 + Math.sin(a) * 8, () => { if (i === 0) say(mob, pick(LINES.meeting)); });
    });
    log('회의 소집: 근무 중 ' + list.length + '명 집합 (내 화면에서만)');
  });
  window.addEventListener('keydown', e => {
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || !$('modal-back').hidden) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 8) { const o = deskOwner(n - 1); if (o) openStatus(o.id); }
  });

  /* ================= 연결 ================= */
  async function connect() {
    hotCaption('캐릭터를 끌어 옮기고, 두 번 누르면 상태창이 열려요.');
    renderAll();
    log('후동부 사무실에 들어왔어요');
    let store = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') store = await claudeStore();
      else if (SUPABASE.url && SUPABASE.key) store = await supabaseStore();
    } catch (e) { log('저장소에 연결하지 못했어요.'); }
    S.store = store;
    if (!store) { S.loaded = true; renderAll(); return; }
    $('backend').textContent = store.label;
    S.myId = store.myId; S.isOwner = store.isOwner; S.readOnly = !store.canWrite;
    if (store.needsLogin) { S.loaded = true; }

    const slowTimer = setTimeout(() => { if (!S.loaded) { S.slow = true; renderAll(); } }, 10000);
    let gotM = false, gotC = false;
    const ready = () => { if (gotM && gotC && !S.loaded) { S.loaded = true; S.slow = false; clearTimeout(slowTimer); } };

    store.onMembers(list => {
      if (!list) { gotM = true; ready(); renderAll(); return; }
      const next = new Map();
      for (const d of list) next.set(d.id, normMember(d.id, d));
      if (S.loaded && gotM) {
        for (const [id, d] of next) {
          const prev = S.members.get(id);
          if (!prev) log(d.name + ' 입사!');
          else if (prev.status !== d.status) {
            if (d.status === 'in') log(d.name + ' 출근 (' + hhmm(d.since) + ')');
            else if (d.status === 'out') { const t = todayOf(d); log(d.name + ' 퇴근 · 오늘 ' + fmtDur(t.ms) + ', 업무 ' + t.done + '개'); }
          }
        }
      }
      S.members = next;
      if (S.statusFor && S.statusFor !== NPC_ID && !S.members.has(S.statusFor)) closeStatus();
      gotM = true; ready(); renderAll();
    });
    store.onContents(list => {
      S.contents = (list || []).map(d => ({ id: String(d.id), name: clip(d.name, 20) || '컨텐츠', order: Number(d.order) || 0 })).sort((a, b) => a.order - b.order);
      gotC = true; ready(); renderAll();
    });
  }
  connect();
})();
</script>
