<meta charset="utf-8">
<title>후동부 사무실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/galmuri@2.39.2/dist/galmuri.css" rel="stylesheet">
<style>
/* Layout: 어두운 상단바 → 컨텐츠 탭과 보라 진행 바 → 왼쪽 정보 패널 + 가운데 픽셀 사무실(오른쪽 서랍 상태창) → 하단 상태줄 */
:root {
  color-scheme: dark;
  --bg: #0e0c12;
  --bar: #16131c;
  --panel: #1b1722;
  --panel-hi: #2a2433;
  --line: #322b3d;
  --ink: #ece8f2;
  --ink-dim: #b3abc0;
  --ink-mute: #857d93;
  --purple: #c46be6;
  --purple-lo: #4a2a5c;
  --green: #4fb83a;
  --green-lo: #2b6b1d;
  --gold: #f4c542;
  --red: #d8463a;
  --inv: #c6c6c6;
  --inv-ink: #2b2b2b;
  --inv-mute: #5a5a5a;
  --slot: #8b8b8b;
  --f-ui: 'Galmuri11', 'Do Hyeon', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --f-big: 'Galmuri14', 'Galmuri11', 'Do Hyeon', sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
canvas, img { image-rendering: pixelated; }

.app {
  min-height: 100%;
  display: flex; flex-direction: column;
  padding-block: 0 0;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- 마크 버튼 ---------- */
.mc-btn {
  background: #6f6f6f; color: #fff;
  border: 2px solid #000;
  box-shadow: inset 2px 2px 0 #a9a9a9, inset -2px -2px 0 #3f3f3f;
  padding: 6px 12px; cursor: pointer; white-space: nowrap; line-height: 1.3;
}
.mc-btn:hover { background: #8484a0; }
.mc-btn:active { box-shadow: inset -2px -2px 0 #a9a9a9, inset 2px 2px 0 #3f3f3f; }
.mc-btn:disabled { opacity: .4; cursor: not-allowed; }
.mc-btn.green { background: #2f7a1a; box-shadow: inset 2px 2px 0 #6ec746, inset -2px -2px 0 #1b4a0e; }
.mc-btn.green:hover { background: #3a9221; }
.mc-btn.red { background: #a32a1b; box-shadow: inset 2px 2px 0 #e07a68, inset -2px -2px 0 #5a1a10; }
.mc-btn.red:hover { background: #bd3422; }
.mc-btn.small { padding: 4px 8px; font-size: 12px; }
:is(.mc-btn, .tab, .desk, .mob, input, select, summary, .slot):focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- 상단바 ---------- */
.topbar { background: var(--bar); border-bottom: 1px solid #000; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-ico { width: 24px; height: 24px; flex: none; border: 1px solid #000; }
.brand b { font-family: var(--f-big); font-weight: 400; font-size: 17px; color: #fff; }
.brand span { color: var(--ink-mute); font-size: 13px; }
.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
.live i { width: 8px; height: 8px; background: #6b6b6b; display: inline-block; }
.live.on i { background: #5bd23f; box-shadow: 0 0 6px #5bd23f; }
.now { font-size: 13px; color: var(--ink-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.now b { color: #fff; font-weight: 400; }

/* ---------- 컨텐츠 탭 + 진행 바 ---------- */
.tabs-wrap { background: var(--bg); padding-block: 8px 4px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.tab {
  flex: none; display: inline-flex; align-items: center; gap: 8px;
  background: #3a3a3a; color: #bdbdbd;
  border: 2px solid #000;
  box-shadow: inset 2px 2px 0 #565656, inset -2px -2px 0 #262626;
  padding: 5px 8px 5px 12px; cursor: pointer; white-space: nowrap; font-size: 13px;
}
.tab:hover { background: #4a4a4a; }
.tab[aria-selected="true"] { background: #d4d4d4; color: #1e1e1e; box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #8b8b8b; }
.tab .cnt { min-width: 20px; text-align: center; font-size: 12px; padding: 0 4px; background: #262626; color: #9a9a9a; border: 1px solid #000; }
.tab .cnt.on { background: var(--green); color: #fff; }
.tab.add { color: var(--gold); padding-right: 12px; }
.add-content { display: flex; gap: 6px; margin-top: 6px; max-width: 420px; }
.add-content input { flex: 1; min-width: 0; }
.progress { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-block: 2px 8px; text-align: center; }
.progress .ptxt { font-size: 13px; color: var(--ink-dim); }
.progress .ptxt b { color: var(--purple); font-weight: 400; }
.progress .ptxt strong { color: #fff; font-weight: 400; }
.pbar { width: min(560px, 100%); height: 6px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
.pbar i { background: var(--purple-lo); }
.pbar i.on { background: var(--purple); box-shadow: 0 0 4px rgba(196,107,230,.6); }

/* ---------- 메인 ---------- */
.main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding-block: 0 12px; min-height: 0; }
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; order: 2; }
.world { position: relative; min-width: 0; order: 1; display: flex; flex-direction: column; }
@media (min-width: 1100px) {
  html, body { height: 100%; }
  .app { height: 100%; }
  .main { grid-template-columns: 330px minmax(0, 1fr); }
  .side { order: 0; min-height: 0; overflow-y: auto; padding-right: 2px; }
  .world { min-height: 0; }
  .office-scroll { flex: 1; }
}

.panel { background: var(--panel); border: 1px solid var(--line); padding: 12px; min-width: 0; }
.p-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.p-head .t { color: var(--gold); font-size: 13px; }
.p-head .a { color: var(--ink-mute); font-size: 12px; }
.muted { color: var(--ink-mute); font-size: 12px; }
.notice { border: 1px solid #000; padding: 8px 10px; font-size: 13px; background: #3c2f12; color: #ffe6a0; }
.notice.info { background: #13283a; color: #cbe8fb; }
.txt { width: 100%; min-width: 0; background: #0b0a0e; border: 1px solid #5a5266; padding: 7px 9px; color: var(--ink); }
.txt::placeholder { color: #6e6680; }
select.txt { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, #aaa 50%), linear-gradient(-45deg, transparent 50%, #aaa 50%); background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 26px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-dim); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* 내 자리 */
.me-head { display: flex; gap: 12px; align-items: center; }
.face { flex: none; width: 56px; height: 56px; background: var(--slot); border: 2px solid #000; box-shadow: inset 2px 2px 0 #373737, inset -2px -2px 0 #fff; display: grid; place-items: center; }
.face canvas { width: 40px; height: 40px; }
.me-name { font-family: var(--f-big); font-size: 17px; overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.bdg { font-size: 11px; padding: 1px 6px; border: 1px solid #000; white-space: nowrap; background: #d9d9d9; color: #222; }
.bdg.g { background: #5fae3e; color: #fff; }
.bdg.dk { background: #4a4a4a; color: #ddd; }
.bdg.gold { background: var(--gold); color: #2b2100; }
.bdg.blue { background: #3150a8; color: #fff; }
.clock2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
.clock2 .mc-btn { padding: 9px 6px; font-size: 15px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.stat { background: #0f0d13; border: 1px solid var(--line); padding: 6px 8px; }
.stat .k { font-size: 11px; color: var(--ink-mute); }
.stat .v { font-size: 16px; font-variant-numeric: tabular-nums; }
.skin-pick { display: flex; gap: 10px; align-items: center; }
.skin-preview { flex: none; width: 56px; height: 84px; background: #0b0a0e; border: 1px solid var(--line); display: grid; place-items: center; }
.skin-preview canvas { width: 32px; height: 64px; }
.file-btn { position: relative; overflow: hidden; display: inline-block; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.join-form, .login { display: flex; flex-direction: column; gap: 9px; }

/* 출퇴근 현황 */
.board { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.board th { text-align: left; font-weight: 400; color: var(--ink-mute); padding: 3px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.board td { padding: 5px 4px; border-bottom: 1px solid #241f2c; vertical-align: middle; }
.board tr { cursor: pointer; }
.board tbody tr:hover td { background: #241f2c; }
.board tr.sel td { background: #2a2235; }
.board .nm { display: flex; align-items: center; gap: 6px; min-width: 90px; }
.board .nm canvas { width: 20px; height: 20px; border: 1px solid #000; flex: none; }
.board .num { text-align: right; white-space: nowrap; }
.apv { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; background: #0f0d13; border: 1px solid var(--line); padding: 7px 8px; margin-bottom: 6px; }
.apv .nm { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 160px; }
.apv .nm canvas { width: 28px; height: 28px; border: 1px solid #000; flex: none; }
.log { list-style: none; margin: 0; padding: 0; max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.log li { display: flex; gap: 8px; }
.log time { flex: none; color: var(--green); font-variant-numeric: tabular-nums; }
.log span { min-width: 0; overflow-wrap: anywhere; color: var(--ink-dim); }

/* ---------- 사무실 (픽셀 월드) ---------- */
.office-scroll { overflow-x: auto; overflow-y: hidden; border: 1px solid #000; background: #000; }
.office {
  --s: 3;
  position: relative; width: 100%; min-width: 760px; height: 100%; min-height: 600px;
  overflow: hidden; touch-action: none;
  background-color: #5ea13a; background-size: 48px 48px;
  user-select: none; -webkit-user-select: none;
}
.layer { position: absolute; pointer-events: none; background-size: 48px 48px; }
.l-wall { left: 0; right: 0; top: 0; height: 20%; min-height: 110px; }
.l-vines { left: 0; right: 0; top: 0; height: 14px; background-size: 24px 24px; }
.l-wall::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #3b2a1a; box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.l-log { top: 0; bottom: 0; width: 5%; min-width: 36px; background-size: 48px 48px; box-shadow: inset -3px 0 0 rgba(0,0,0,.25); }
.l-log.l { left: 0; } .l-log.r { right: 0; box-shadow: inset 3px 0 0 rgba(0,0,0,.25); }
.l-path { left: 0; right: 0; top: 79%; height: 6%; background-size: 48px 48px; box-shadow: inset 0 3px 0 rgba(0,0,0,.18); }
.l-bottom { left: 0; right: 0; bottom: 0; height: 2.2%; min-height: 10px; background-size: 48px 48px; }
.spr { position: absolute; pointer-events: none; image-rendering: pixelated; }
.flower { position: absolute; width: 6px; height: 6px; pointer-events: none; }
.flower::before { content: ""; position: absolute; left: 1px; top: 3px; width: 2px; height: 3px; background: #2f6b1d; }
.flower::after { content: ""; position: absolute; left: 0; top: 0; width: 4px; height: 4px; background: var(--c); }

.desk { position: absolute; transform: translateX(-50%); width: 15%; max-width: 170px; min-width: 104px; cursor: pointer; border: 0; padding: 0; background: none; display: flex; flex-direction: column; align-items: stretch; }
.desk.boss { width: 19%; max-width: 210px; }
.dk-items { position: relative; height: 34px; pointer-events: none; }
.dk-mon { position: absolute; left: 14%; bottom: 0; width: 40%; height: 30px; background: #1c1c1c; border: 3px solid #0d0d0d; }
.dk-mon::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 4px; margin-left: -5px; background: #0d0d0d; }
.dk-mon.on { background: #1d2f3d; box-shadow: inset 0 0 0 2px #2b4c63; }
.dk-mon.boss-on { border-color: #b23a2e #0d0d0d #0d0d0d #b23a2e; }
.dk-prop { position: absolute; bottom: 0; width: 30px; height: 30px; }
.dk-prop.l { left: 0; } .dk-prop.r { right: 4%; }
.dk-top { height: 12px; background: #e2c58e; border: 2px solid #8a6a3a; border-bottom-width: 3px; }
.dk-front { position: relative; height: 40px; margin: 0 6%; background: #d8b97f; box-shadow: inset 0 3px 0 #c4a26a; border-left: 3px solid #b8955c; border-right: 3px solid #b8955c; }
.dk-front img { position: absolute; left: 8%; right: 8%; bottom: 4px; width: 84%; height: 30px; object-fit: contain; }
.dk-legs { height: 12px; margin: 0 6%; display: flex; justify-content: space-between; }
.dk-legs::before, .dk-legs::after { content: ""; width: 6px; background: #b8955c; box-shadow: inset -2px 0 0 #9c7a45; }
.dk-label { align-self: center; margin-top: 3px; font-size: 11px; line-height: 1.2; padding: 1px 6px; background: rgba(0,0,0,.55); color: #f1e4c8; white-space: nowrap; max-width: 150%; overflow: hidden; text-overflow: ellipsis; }
.desk.empty .dk-label { color: #b9b0a0; }
.desk.sel .dk-label { background: var(--gold); color: #2b2100; }
.desk.dim, .mob.dim { opacity: .38; filter: grayscale(.6); }

/* 캐릭터 */
.mob { position: absolute; width: 48px; transform: translate(-50%, -100%); cursor: grab; touch-action: none; }
.mob.dragging { cursor: grabbing; }
.mob .nm-tag { position: absolute; bottom: calc(100% + 16px); left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.5); color: #fff; font-size: 11px; padding: 0 5px; white-space: nowrap; pointer-events: none; }
.mob.me .nm-tag { color: #a7f58a; }
.mob .wbar { position: absolute; bottom: calc(100% + 5px); left: 50%; width: 34px; margin-left: -17px; height: 6px; background: #f2f2f2; border: 1px solid #000; pointer-events: none; }
.mob .wbar i { display: block; height: 100%; background: var(--green); }
.mob .bubble { position: absolute; bottom: calc(100% + 34px); left: 50%; transform: translateX(-50%); width: max-content; max-width: 200px; background: #fff; color: #111; border: 2px solid #000; box-shadow: 3px 3px 0 rgba(0,0,0,.35); padding: 5px 8px; font-size: 12px; pointer-events: none; z-index: 3; overflow-wrap: anywhere; }
.mob .bubble::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -6px; border: 6px solid transparent; border-top-color: #000; }
.figure { position: relative; width: 48px; height: 96px; }
.figure .part { position: absolute; }
.figure .head { left: 12px; top: 0; width: 24px; height: 24px; z-index: 3; }
.figure .body { left: 12px; top: 24px; width: 24px; height: 36px; z-index: 2; }
.figure .arm-r { left: 0; top: 24px; width: 12px; height: 36px; transform-origin: 50% 4px; z-index: 1; }
.figure .arm-l { left: 36px; top: 24px; width: 12px; height: 36px; transform-origin: 50% 4px; z-index: 1; }
.figure .leg-r { left: 12px; top: 60px; width: 12px; height: 36px; transform-origin: 50% 2px; }
.figure .leg-l { left: 24px; top: 60px; width: 12px; height: 36px; transform-origin: 50% 2px; }
.mob.facing-left .figure { transform: scaleX(-1); }
.mob::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -4px; height: 7px; background: rgba(0,0,0,.25); border-radius: 50%; z-index: -1; }
@keyframes swing-a { 0%,100% { transform: rotate(26deg); } 50% { transform: rotate(-26deg); } }
@keyframes swing-b { 0%,100% { transform: rotate(-26deg); } 50% { transform: rotate(26deg); } }
@keyframes flail-a { 0%,100% { transform: rotate(150deg); } 50% { transform: rotate(110deg); } }
@keyframes flail-b { 0%,100% { transform: rotate(-110deg); } 50% { transform: rotate(-150deg); } }
@keyframes kick { 0%,100% { transform: rotate(18deg); } 50% { transform: rotate(-18deg); } }
@keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
@keyframes shake { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
.mob.walking .arm-r, .mob.walking .leg-l { animation: swing-a .5s steps(4) infinite; }
.mob.walking .arm-l, .mob.walking .leg-r { animation: swing-b .5s steps(4) infinite; }
.mob.idle .head { animation: breathe 2.4s steps(2) infinite; }
.mob.dragging .figure { animation: shake .18s steps(2) infinite; }
.mob.dragging .arm-r { animation: flail-a .22s steps(2) infinite; }
.mob.dragging .arm-l { animation: flail-b .22s steps(2) infinite; }
.mob.dragging .leg-r { animation: kick .2s steps(2) infinite; }
.mob.dragging .leg-l { animation: kick .2s steps(2) infinite reverse; }

.mtip { position: absolute; z-index: 4000; pointer-events: none; background: #0d0a12; border: 2px solid #3d2aa6; box-shadow: 0 0 0 1px #000; padding: 6px 10px; font-size: 13px; line-height: 1.5; color: #d8d3e0; max-width: 260px; }
.mtip .n { color: #6fd36a; }

/* 하단 상태줄 */
.statusbar { background: var(--bar); border-top: 1px solid #000; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-mute); padding-block: 5px; font-variant-numeric: tabular-nums; }
.statusbar b { color: var(--ink-dim); font-weight: 400; }

/* ---------- 오른쪽 서랍 상태창 ---------- */
.drawer {
  position: absolute; top: 0; right: 0; bottom: 0; z-index: 6000;
  width: min(440px, 100%);
  background: var(--inv); color: var(--inv-ink);
  border-left: 3px solid #000; box-shadow: -6px 0 0 rgba(0,0,0,.35);
  overflow-y: auto; overscroll-behavior: contain;
}
@media (max-width: 1099px) {
  .drawer { position: fixed; inset: 0; width: 100%; border-left: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
}
.dr-banner { height: 56px; background-size: 48px 48px; border-bottom: 3px solid #6b6b6b; position: relative; }
.dr-close { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; padding: 0; font-size: 13px; }
.dr-body { padding: 12px 14px 18px; }
.dr-head { display: flex; gap: 12px; align-items: center; }
.dr-face { flex: none; width: 64px; height: 64px; background: var(--slot); border: 2px solid; border-color: #373737 #fff #fff #373737; display: grid; place-items: center; }
.dr-face canvas { width: 48px; height: 48px; }
.dr-name { font-family: var(--f-big); font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; }
.dr-name i { width: 8px; height: 12px; background: var(--c, #c43a3a); display: inline-block; box-shadow: 0 6px 0 -3px #2f6b1d; }
.dr-quote { font-size: 12px; color: var(--inv-mute); margin-top: 2px; overflow-wrap: anywhere; }
.inv-row { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 2px; background: #555; border: 2px solid #000; padding: 3px; margin-top: 12px; }
.slot { aspect-ratio: 1; background: var(--slot); box-shadow: inset 2px 2px 0 #373737, inset -2px -2px 0 #fff; display: grid; place-items: center; position: relative; }
.slot img { width: 70%; height: 70%; }
.slot .q { position: absolute; right: 2px; bottom: 0; font-size: 10px; color: #fff; text-shadow: 1px 1px 0 #000; }
.dr-sec { margin-top: 16px; }
.dr-sec > h3 { margin: 0 0 8px; font-size: 14px; font-weight: 400; display: flex; align-items: center; gap: 6px; }
.dr-sec > h3::before { content: ""; width: 6px; height: 10px; background: #c43a3a; box-shadow: 0 5px 0 -2px #2f6b1d; }
.dr-sec > h3 span { margin-left: auto; font-size: 12px; color: var(--inv-mute); }
.card { background: #e6e6e6; border: 2px solid #000; box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #a0a0a0; padding: 10px 12px; }
.card + .card { margin-top: 6px; }
.task-title { font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; overflow-wrap: anywhere; }

.mini:first-child { border-top: 0; }
.mini .big-bar { grid-column: 1 / -1; margin-top: 2px; height: 10px; }
.timeline { list-style: none; margin: 0; padding: 0; font-size: 12px; }
.timeline li { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px; padding: 3px 0; }
.timeline time { color: var(--inv-mute); font-variant-numeric: tabular-nums; }
.timeline span { overflow-wrap: anywhere; }
details.past summary { cursor: pointer; font-size: 14px; list-style: none; display: flex; align-items: center; gap: 6px; }
details.past summary::-webkit-details-marker { display: none; }
details.past summary::before { content: "▶"; font-size: 10px; }
details.past[open] summary::before { content: "▼"; }
.past-item { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px solid #b0b0b0; font-size: 13px; }
.past-item span:first-child { overflow-wrap: anywhere; min-width: 0; }
.past-item .when { flex: none; font-size: 12px; color: var(--inv-mute); }
.drawer .txt { background: #0b0a0e; color: #ece8f2; border-color: #000; }
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; margin-top: 8px; }
.add-row select { grid-column: 1 / -1; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; align-items: end; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; font-size: 11px; }
.wk .bb { height: 70px; width: 100%; display: flex; align-items: flex-end; justify-content: center; background: #2a2a2a; border: 1px solid #000; }
.wk .bb i { width: 66%; background: linear-gradient(90deg, #5fd03f 0 50%, #3fa82a 50%); }
.wk .bb i.today { background: linear-gradient(90deg, #ffd24a 0 50%, #e0a92a 50%); }
.wk .n { color: #2e7a19; min-height: 14px; }
.wk .d { color: var(--inv-mute); }
.cp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; padding: 6px 0; border-top: 1px solid #b0b0b0; font-size: 13px; }

.cp .pbar { grid-column: 1 / -1; width: 100%; height: 6px; }

        const sel = el('select', { class: 'txt', id: 'dr-add-c', 'aria-label': '컨텐츠 선택' }, el('option', { value: '', text: '컨텐츠: 기타' }), S.contents.map(c => el('option', { value: c.id, text: '컨텐츠: ' + c.name })));
        if (S.view !== 'all') sel.value = S.view;
        const f = el('form', { class: 'add-row' }, sel, inp, el('button', { class: 'mc-btn green', type: 'submit', text: '업무 추가' }));
        f.addEventListener('submit', e => { e.preventDefault(); if (!clip(inp.value, 60)) return; addTask(inp.value, sel.value); inp.value = ''; });
        now1.append(f, el('div', { class: 'muted', style: 'color:#5a5a5a;margin-top:4px', text: '막대 칸을 누르면 25%씩 진행돼요. 네 칸을 다 채우면 완료!' }));
      }
      body.append(now1);

      // 진행 기록
      const tl = el('ul', { class: 'timeline' });
      const logs = (m.log || []).slice().reverse().slice(0, 14);
      if (!logs.length) tl.append(el('li', null, el('time', { text: '' }), el('span', { text: '아직 기록이 없어요.' })));
      for (const l of logs) tl.append(el('li', null, el('time', { text: mdhm(l.t) }), el('span', { text: l.m })));
      body.append(el('div', { class: 'dr-sec' }, el('h3', { text: '진행 기록' }), el('div', { class: 'card' }, tl)));

      // 지난 작업
      const past = el('details', { class: 'past card' }, el('summary', { text: '지난 작업 ' + dones.length + '건' }));
      if (!dones.length) past.append(el('div', { class: 'muted', style: 'color:#5a5a5a;padding-top:6px', text: '끝낸 업무가 아직 없어요.' }));
      for (const d of dones.slice(0, 30)) { const c = S.contents.find(x => x.id === d.c); past.append(el('div', { class: 'past-item' }, el('span', null, d.t + (c ? ' · ' + c.name : '') + ' ', el('span', { class: 'bdg blue', text: '완료' })), el('span', { class: 'when', text: d.at ? mdhm(d.at) : '' }))); }
      body.append(el('div', { class: 'dr-sec' }, past));

      // 최근 7일
      const byDate = new Map(S.week.filter(d => d && d.date).map(d => [d.date, d]));
      const days = [];
      for (let k = 6; k >= 0; k--) {
        const dt = new Date(now); dt.setDate(dt.getDate() - k);
        const key = dateKey(dt.getTime()), d = byDate.get(key);
        let ms = d ? Number(d.ms) || 0 : 0, dn = d && Array.isArray(d.done) ? d.done.length : 0;
        if (k === 0) { ms = Math.max(ms, t.ms); dn = Math.max(dn, t.done); }
        days.push({ ms, dn, today: k === 0, lab: (dt.getMonth() + 1) + '/' + dt.getDate() + ' ' + WEEKDAY[dt.getDay()] });
      }
      const max = Math.max(4 * 3600000, ...days.map(d => d.ms));
      const total = days.reduce((a, d) => a + d.ms, 0);
      const week = el('div', { class: 'week', role: 'img', 'aria-label': '최근 7일 근무 ' + days.map(d => d.lab + ' ' + fmtShort(d.ms)).join(', ') });
      for (const d of days) week.append(el('div', { class: 'wk' }, el('span', { text: d.ms ? fmtShort(d.ms) : '-' }), el('div', { class: 'bb' }, el('i', { class: d.today ? 'today' : '', style: 'height:' + Math.round(d.ms / max * 100) + '%' })), el('span', { class: 'n', text: d.dn ? '✓' + d.dn : '' }), el('span', { class: 'd', text: d.lab })));
      const wsec = el('div', { class: 'dr-sec' }, el('h3', null, '최근 7일 근무', el('span', { text: fmtDur(total) })), el('div', { class: 'card' }, week));
      body.append(wsec);

      // 컨텐츠 진행도 (+ 관리)
      const csec = el('div', { class: 'dr-sec' }, el('h3', null, '컨텐츠 진행도', el('span', { text: S.contents.length + '개' })));
      const ccard = el('div', { class: 'card' });
      if (!S.contents.length) ccard.append(el('div', { class: 'muted', style: 'color:#5a5a5a', text: '컨텐츠가 없어요.' }));
      for (const c of S.contents) {
        const all = crew().flatMap(x => (x.tasks || []).filter(tk => tk.c === c.id)); const pct = avgP(all);
        const mineN = (m.tasks || []).filter(tk => tk.c === c.id).length;
        const pb = el('div', { class: 'pbar' }); for (let k = 0; k < 10; k++) pb.append(el('i', { class: pct >= (k + 1) * 10 ? 'on' : '' }));
        ccard.append(el('div', { class: 'cp' }, el('span', { text: c.name + (mineN ? ' · 담당 ' + mineN + '개' : '') }), el('span', { text: pct + '%' }), pb,
          S.isOwner && mine ? el('button', { class: 'mc-btn small red', type: 'button', style: 'grid-column:1/-1;justify-self:start', text: '컨텐츠 끝내기', onclick: e => { const b = e.currentTarget; if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = '한 번 더 누르면 목록에서 빠져요'; return; } queueWrite(() => S.store.deleteContent(c.id)).then(() => { log('컨텐츠 종료: ' + c.name); if (S.view === c.id) S.view = 'all'; }).catch(() => {}); } }) : null));
      }
      csec.append(ccard); body.append(csec);

      if (S.isOwner && !mine && id !== S.myId && S.store) body.append(el('div', { class: 'btn-row', style: 'margin-top:16px' }, el('button', { class: 'mc-btn small red', type: 'button', text: '이 팀원 내보내기', onclick: e => { const b = e.currentTarget; if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = '한 번 더 누르면 내보내요'; return; } queueWrite(() => S.store.deleteMember(id)).then(() => { log(m.name + ' 팀원을 내보냈어요'); closeDrawer(); }).catch(() => {}); } })));
    }
    kids.push(body);
    dr.replaceChildren(...kids);
  }

  /* ================= 전체 렌더 ================= */
  function preserve(fn) {
    const vals = {};
    document.querySelectorAll('.side input[id], .side select[id], .drawer input[id], .drawer select[id], #new-content').forEach(i => { if (i.type !== 'file' && i.type !== 'checkbox') vals[i.id] = i.value; });
    const act = document.activeElement && document.activeElement.id;
    const drScroll = $('drawer').scrollTop;
    fn();
    for (const [id, v] of Object.entries(vals)) { const e = document.getElementById(id); if (e && e.type !== 'file') e.value = v; }
    $('drawer').scrollTop = drScroll;
    if (act) { const e = document.getElementById(act); if (e && e !== document.activeElement) e.focus(); }
  }
  function renderAll() {
    preserve(() => {
      renderStage(); syncMobs(); renderDesks(); renderTabs(); renderProgress(); renderStatusbar();
      renderMe(); renderApprovals(); renderBoard();
      if (S.drawerFor) renderDrawer();
    });
  }

  /* 시계 (표시만) */
  function tick() {
    const now = Date.now();
    const n = $('now'); n.textContent = ''; n.append(longDate(now) + ' ', el('b', { text: hhmmss(now) }));
    const m = myMember(); const v = $('my-ms'); if (m && v) v.textContent = fmtDur(todayOf(m, now).ms);
    const dc = $('dr-clock'); if (dc) dc.textContent = hhmm(now);
    const dm = $('dr-ms'); const dmm = S.drawerFor && S.members.get(S.drawerFor); if (dm && dmm) dm.textContent = fmtDur(todayOf(dmm, now).ms);
  }
  tick(); setInterval(tick, 1000);
  let lastDay = dateKey();
  setInterval(() => { if (document.hidden) return; if (dateKey() !== lastDay) { lastDay = dateKey(); renderAll(); } else { renderBoard(); if (S.drawerFor) preserve(renderDrawer); } }, 60000);

  /* 버튼 */
  px('brand', 16, 16, () => {});
  (() => { const c = $('brand-ico'), x = c.getContext('2d'); const img = new Image(); img.onload = () => { x.imageSmoothingEnabled = false; x.drawImage(img, 0, 0, 16, 16); x.fillStyle = '#5ea13a'; x.fillRect(0, 0, 16, 5); x.fillStyle = '#3d6b22'; x.fillRect(0, 5, 16, 1); }; img.src = T.dirt(); })();
  $('btn-sound').addEventListener('click', e => { soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', String(soundOn)); e.currentTarget.textContent = soundOn ? '사운드 켜짐' : '사운드 꺼짐'; beep('click'); });
  $('btn-meeting').addEventListener('click', () => {
    const list = [...mobs.values()];
    list.forEach((mob, i) => { const a = (i / Math.max(1, list.length)) * Math.PI * 2; walkTo(mob, 50 + Math.cos(a) * 14, 74 + Math.sin(a) * 3, () => { if (i === 0) say(mob, pick(LINES.meeting)); setTimeout(() => { const h = homeOf(mob); walkTo(mob, h.x, h.y); }, 6000); }); });
    log('회의 소집: ' + list.length + '명 집합 (내 화면에서만)');
  });
  $('add-content').addEventListener('submit', e => { e.preventDefault(); addContent($('new-content').value); $('new-content').value = ''; $('add-content').hidden = true; });
  $('add-content-cancel').addEventListener('click', () => { $('add-content').hidden = true; });
  window.addEventListener('keydown', e => {
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || !$('drawer').hidden) return;
    const n = parseInt(e.key, 10); if (n >= 1 && n <= 8) { const o = deskOwner(n - 1); if (o) openDrawer(o.id); }
  });

  /* ================= 연결 ================= */
  async function connect() {
    renderAll();
    log('후동부 사무실에 들어왔어요');
    let store = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') store = await claudeStore();
      else {
        let cfg = SUPABASE;
        if (!(cfg.url && cfg.key)) { try { await loadScript('config.js'); } catch (e) {} if (window.HUDONGBU_SUPABASE) cfg = window.HUDONGBU_SUPABASE; }
        S.cfgFound = !!(cfg && cfg.url && cfg.key);
        if (S.cfgFound) store = await supabaseStore(cfg);
      }
    } catch (e) { log('저장소에 연결하지 못했어요.'); }
    S.store = store;
    $('live').classList.toggle('on', !!store); $('live-t').textContent = store ? '실시간 연결됨' : '연결 안 됨';
    if (!store) { S.loaded = true; renderAll(); return; }
    S.myId = store.myId; S.isOwner = store.isOwner; S.readOnly = !store.canWrite;
    if (store.needsLogin) S.loaded = true;
    const slowTimer = setTimeout(() => { if (!S.loaded) { S.slow = true; renderAll(); } }, 10000);
    let gotM = false, gotC = false;
    const ready = () => { if (gotM && gotC && !S.loaded) { S.loaded = true; S.slow = false; clearTimeout(slowTimer); } };
    store.onMembers(list => {
      if (!list) { gotM = true; ready(); renderAll(); return; }
      const next = new Map();
      for (const d of list) next.set(d.id, normMember(d.id, d));
      if (S.loaded && gotM) for (const [id, d] of next) {
        const prev = S.members.get(id);
        if (!prev) log(d.approved ? d.name + ' 입사!' : '새 입사 신청: ' + d.name);
        else if (!prev.approved && d.approved) { log(d.name + ' 입사 승인!'); if (id === S.myId) { beep('xp'); setTimeout(() => location.reload(), 800); } }
        else if (prev.status !== d.status) { if (d.status === 'in') log(d.name + ' 출근 (' + hhmm(d.since) + ')'); else if (d.status === 'out') { const t = todayOf(d); log(d.name + ' 퇴근 · 오늘 ' + fmtDur(t.ms) + ', 업무 ' + t.done + '개'); } }
        else { const pd = doneTasks(prev).length, nd = doneTasks(d).length; if (nd > pd) log(d.name + ' 업무 완료: ' + doneTasks(d)[0].t); }
      }
      S.members = next;
      if (S.drawerFor && S.drawerFor !== NPC_ID && !S.members.has(S.drawerFor)) closeDrawer();
      gotM = true; ready(); renderAll();
    });
    store.onContents(list => {
      S.contents = (list || []).map(d => ({ id: String(d.id), name: clip(d.name, 20) || '컨텐츠', order: Number(d.order) || 0 })).sort((a, b) => a.order - b.order);
      if (S.view !== 'all' && !S.contents.find(c => c.id === S.view)) S.view = 'all';
      gotC = true; ready(); renderAll();
    });
  }
  connect();
})();
</script>
